name: Release integrity

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify published reference
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin production --no-tags
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = "tag"
          test "$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")" = "$(git rev-parse origin/production)"
          test "${GITHUB_REF_NAME}" = "v1.0.0"

      - name: Verify repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d tests/private
          test -f assets/banner.png
          grep -Fq 'ArcadiaTrancheProtocol' README.md
          grep -Fq 'string internal constant VERSION = "1.0.0";' src/types/ArcadiaTypes.sol

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run release validation
        run: bash scripts/ci.sh
