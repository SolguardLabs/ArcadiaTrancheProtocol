name: Release integrity

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify published reference
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            refs/heads/production:refs/remotes/origin/production \
            --no-tags
          tag_refs="$(git ls-remote --tags origin \
            "refs/tags/${GITHUB_REF_NAME}" \
            "refs/tags/${GITHUB_REF_NAME}^{}")"
          tag_object="$(printf '%s\n' "$tag_refs" | awk -v ref="refs/tags/${GITHUB_REF_NAME}" '$2 == ref { print $1 }')"
          tag_commit="$(printf '%s\n' "$tag_refs" | awk -v ref="refs/tags/${GITHUB_REF_NAME}^{}" '$2 == ref { print $1 }')"
          test -n "$tag_object"
          test -n "$tag_commit"
          test "$tag_object" != "$tag_commit"
          test "$tag_commit" = "$(git rev-parse origin/production)"
          test "$tag_commit" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "v1.0.0"

      - name: Verify repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d tests/private
          test -f assets/banner.png
          grep -Fq 'ArcadiaTrancheProtocol' README.md
          grep -Fq 'string internal constant VERSION = "1.0.0";' src/types/ArcadiaTypes.sol

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Run release validation
        run: bash scripts/ci.sh
